    <!-- Schema.org Structured Data (Person) -->

        "name": "Akash Thakare",
        "jobTitle": "Computer Engineering Student & Cybersecurity Intern",

    <!-- Prevent theme flash before React mounts -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('akash-portfolio-theme');
          var root = document.documentElement;
          if (saved === 'light') {
            root.classList.remove('dark');
          } else {
            root.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>

  <body class="bg-white text-black dark:bg-black dark:text-white antialiased selection:bg-black selection:text-white dark:selection:bg-white dark:selection:text-black">
